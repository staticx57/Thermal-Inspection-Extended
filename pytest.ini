[pytest]
# Pytest configuration for Thermal Inspection test suite

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require hardware/files)
    slow: Slow tests (skip with -m "not slow")
    camera: Tests requiring camera hardware
    gui: Tests requiring GUI/display

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage (when using pytest-cov)
# Run with: pytest --cov=. --cov-report=html
