<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ironbow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#180826;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#A91C68;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#F28218;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFFFA0;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="eyeHeat" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFFFA0;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#F28218;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#A91C68;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#180826;stop-opacity:1" />
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="#1E1E1E" />

  <g transform="translate(100, 100)">
    <text x="100" y="-30" fill="#aaa" font-family="Arial" font-size="16" text-anchor="middle">Concept A: Split Lens</text>
    <circle cx="100" cy="100" r="80" fill="#333" stroke="#555" stroke-width="4" />
    <path d="M 20 100 A 80 80 0 0 0 100 180 L 180 100 Z" fill="url(#ironbow)" /> 
    <path d="M 20 100 L 180 100" stroke="#000" stroke-width="2"/>
    <path d="M 20 100 A 80 80 0 0 1 180 100 Z" fill="#2196F3" opacity="0.2" />
    <path d="M 60 60 L 120 40" stroke="white" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  </g>

  <g transform="translate(450, 100)">
    <text x="100" y="-30" fill="#aaa" font-family="Arial" font-size="16" text-anchor="middle">Concept B: Layered Focus</text>
    <rect x="60" y="60" width="120" height="120" rx="15" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5,5" />
    <rect x="20" y="20" width="120" height="120" rx="15" fill="url(#ironbow)" opacity="0.9" />
    <rect x="70" y="70" width="40" height="40" rx="5" fill="none" stroke="#FFF" stroke-width="3" />
  </g>

  <g transform="translate(100, 350)">
    <text x="100" y="-30" fill="#aaa" font-family="Arial" font-size="16" text-anchor="middle">Concept C: Thermal Eye</text>
    <circle cx="100" cy="100" r="80" fill="#111" stroke="#444" stroke-width="8" />
    <circle cx="100" cy="100" r="60" fill="url(#eyeHeat)" />
    <line x1="100" y1="40" x2="100" y2="160" stroke="#1E1E1E" stroke-width="2" />
    <line x1="40" y1="100" x2="160" y2="100" stroke="#1E1E1E" stroke-width="2" />
    <circle cx="100" cy="100" r="20" fill="none" stroke="#1E1E1E" stroke-width="2" />
  </g>

  <g transform="translate(450, 350)">
    <text x="100" y="-30" fill="#aaa" font-family="Arial" font-size="16" text-anchor="middle">App Icon</text>
    <rect x="20" y="20" width="160" height="160" rx="30" fill="#180826" />
    <rect x="85" y="50" width="30" height="100" rx="5" fill="url(#ironbow)" />
    <rect x="50" y="50" width="100" height="30" rx="5" fill="#ccc" />
  </g>
</svg>